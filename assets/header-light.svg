<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Seungwook Kim</title>
  <desc id="desc">Terminal-style header: AI developer working across speech, NLP, vision, audio, and deployment.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: fade .35s ease-out forwards; }
    .cover { animation-fill-mode: forwards; }
    .pulse { fill-opacity: .12; animation: pulse 3.6s ease-in-out infinite; }
    .flow { stroke: #1a7f37; stroke-width: 1.6; fill: none; stroke-opacity: 0; animation: flow 3.6s ease-in-out infinite; }
    .blink { animation: blink 1.05s steps(1) infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes type { to { transform: translateX(var(--w)); } }
    @keyframes pulse { 0%, 45%, 100% { fill-opacity: .12; } 18% { fill-opacity: .9; } }
    @keyframes flow { 0%, 40%, 100% { stroke-opacity: 0; } 14% { stroke-opacity: .75; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fade { opacity: 1; animation: none; }
      .cover { display: none; }
      .pulse, .flow, .blink { animation: none; }
    }
  </style>
  <defs>
