name: profile

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # 00:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refresh project table
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "chore: refresh project table"; git push; }

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#8250df
            dist/snake-dark.svg?palette=github-dark&color_snake=#d2a8ff

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
